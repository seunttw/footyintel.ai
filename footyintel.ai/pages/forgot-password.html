<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | FootyIntel AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0b1220;color:white;
  font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:2rem 1rem;
}
.card{
  width:100%;max-width:420px;
  background:#111827;border:1px solid #1e293b;
  border-radius:24px;padding:40px;
}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:36px;margin-bottom:8px}
.logo h1{font-size:26px;font-family:'Bebas Neue',sans-serif;letter-spacing:3px;color:#1D9E75;margin-bottom:4px}
.logo p{color:#94a3b8;font-size:13px}
.form-group{margin-bottom:18px}
label{display:block;margin-bottom:7px;color:#cbd5e1;font-size:13px;font-weight:600;letter-spacing:.3px}
input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:1px solid #243044;background:#161f2f;
  color:white;font-size:14px;outline:none;font-family:inherit;transition:border .2s;
}
input:focus{border-color:#1D9E75}
.msg-box{
  display:none;font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:16px;
}
.msg-box.success{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.3);color:#1D9E75;display:block}
.msg-box.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;display:block}
.submit-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:#1D9E75;color:white;font-weight:700;font-size:15px;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.submit-btn:hover{background:#0F6E56;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.footer-link{text-align:center;margin-top:20px;font-size:13px;color:#94a3b8}
.footer-link a{color:#1D9E75;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⚽</div>
    <h1>FootyIntel AI</h1>
    <p>Reset your password</p>
  </div>

  <div class="msg-box" id="msgBox"></div>

  <div id="formWrap">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="handleReset()">Send Reset Link</button>
  </div>

  <div class="footer-link" style="margin-top:24px">
    <p>Remembered it? <a href="login.html">Back to Login</a></p>
  </div>
</div>

<script>
function handleReset() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const btn   = document.getElementById('submitBtn');
  const msg   = document.getElementById('msgBox');

  msg.className = 'msg-box';
  msg.textContent = '';

  if (!email || !email.includes('@')) {
    msg.className = 'msg-box error';
    msg.textContent = 'Please enter a valid email address.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  // Simulate network delay
  setTimeout(() => {
    const users = JSON.parse(localStorage.getItem('fi_users') || '[]');
    const exists = users.find(u => u.email === email);

    // Always show success (don't reveal if account exists — security best practice)
    msg.className = 'msg-box success';
    msg.textContent = `If an account exists for ${email}, a reset link has been sent. Check your inbox.`;
    document.getElementById('formWrap').style.opacity = '0.5';
    document.getElementById('formWrap').style.pointerEvents = 'none';
  }, 900);
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleReset();
});
</script>
</body>
</html>
