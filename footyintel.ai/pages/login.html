<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FootyIntel AI</title>
<link rel="stylesheet" href="../style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;background:#0b1220;color:white;
  font-family:'DM Sans',Inter,sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding:2rem 1rem;
}
.card{width:100%;max-width:420px;background:#111827;border:1px solid #1e293b;border-radius:24px;padding:40px}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:36px;margin-bottom:8px}
.logo h1{font-size:26px;font-family:'Bebas Neue',sans-serif;letter-spacing:3px;color:#1D9E75;margin-bottom:4px}
.logo p{color:#94a3b8;font-size:13px}
.form-group{margin-bottom:18px}
label{display:block;margin-bottom:7px;color:#cbd5e1;font-size:13px;font-weight:600;letter-spacing:.3px}
input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:1px solid #243044;background:#161f2f;
  color:white;font-size:14px;outline:none;font-family:inherit;transition:border .2s;
}
input:focus{border-color:#1D9E75}
input::placeholder{color:#475569}
.error-box{
  display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  color:#f87171;font-size:13px;padding:10px 14px;border-radius:10px;margin-bottom:16px;
}
.error-box.show{display:block}
.login-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:#1D9E75;color:white;font-weight:700;font-size:15px;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.login-btn:hover{background:#0F6E56;transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.footer-link{text-align:center;margin-top:20px;font-size:13px;color:#94a3b8}
.footer-link a{color:#1D9E75;text-decoration:none}
.forgot{text-align:right;margin-top:-10px;margin-bottom:16px}
.forgot a{font-size:12px;color:#1D9E75;text-decoration:none}
.divider{text-align:center;color:#334155;font-size:12px;margin:20px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#1e293b}
.divider::before{left:0}.divider::after{right:0}
</style>
</head>
<body>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚽</div>
    <h1>FootyIntel AI</h1>
    <p>Sign in to access your predictions</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  </div>
  <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In</button>

  <div class="divider">or</div>

  <div class="footer-link">
    <p>Don't have an account? <a href="signup.html">Create Account</a></p>
  </div>
</div>

<script>
// If already signed in, go straight to app
firebase.auth().onAuthStateChanged(user => {
  if (user) window.location.href = 'matches.html';
});

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}

function _friendlyError(code) {
  const map = {
    'auth/user-not-found':       'No account found with this email.',
    'auth/wrong-password':       'Incorrect password. Please try again.',
    'auth/invalid-email':        'Please enter a valid email address.',
    'auth/too-many-requests':    'Too many attempts. Please wait a moment and try again.',
    'auth/invalid-credential':   'Incorrect email or password.',
    'auth/network-request-failed': 'Network error. Check your connection.',
  };
  return map[code] || 'Sign in failed. Please try again.';
}

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');

  document.getElementById('errorBox').classList.remove('show');

  if (!email || !password) {
    showError('Please enter your email and password.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    await firebase.auth().signInWithEmailAndPassword(email, password);
    window.location.href = 'matches.html';
  } catch (err) {
    showError(_friendlyError(err.code));
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
